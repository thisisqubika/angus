name: Gem Validations

# Runs once per commit: on pull requests, and on master after a merge. Running on every
# branch push as well would bill the whole matrix twice for each push to an open PR.
on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch cancels the run still in progress for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Ruby ${{ matrix.ruby }} / rack ${{ matrix.rack }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      statuses: write       # commit status "coverage"
      pull-requests: write  # coverage comment on the PR
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is now 26.04, where setup-ruby has no builds for Ruby 2.5 to 3.1.
        os: [ubuntu-22.04]
        ruby: ['2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4']
        # rack 1.6.13 is the line the services run. angus-router, from every release on
        # rubygems, requires rack ~> 1.5, so there is no rack 2 line to test.
        rack: ['1']
        include:
          # JRuby: the versions the services run in production, all on rack 1.
          # setup-ruby ships x64 builds for ubuntu-24.04 only from JRuby 9.4.8.0 on; older
          # versions have to run on ubuntu-22.04.
          # 9.3.14.0 (external-commerce-service)
          - { os: ubuntu-22.04, ruby: 'jruby-9.3.14.0', rack: '1' }
          # 9.4.1.0
          - { os: ubuntu-22.04, ruby: 'jruby-9.4.1.0', rack: '1' }
          # 9.4.5.0
          - { os: ubuntu-22.04, ruby: 'jruby-9.4.5.0', rack: '1' }

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rack_${{ matrix.rack }}.gemfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # continue-on-error on Ruby 3.4 / rack 1: the coverage action has to run even when the
      # tests fail; the job turns red in the last step.
      - name: Run tests
        id: tests
        continue-on-error: ${{ matrix.ruby == '3.4' && matrix.rack == '1' }}
        run: bundle exec rspec

      # Runs only on Ruby 3.4 / rack 1 so there is a single comment and a single "coverage"
      # commit status per PR.
      - name: Coverage
        if: matrix.ruby == '3.4' && matrix.rack == '1' && !cancelled()
        uses: bancardsa/coverage-action@9ae20e1968f82ec5f8995c82805693da598acf16 # v1.0.0
        with:
          tests-outcome: ${{ steps.tests.outcome }}

      - name: Upload coverage report
        if: matrix.ruby == '3.4' && matrix.rack == '1' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 14

      - name: Fail if tests failed
        if: matrix.ruby == '3.4' && matrix.rack == '1' && !cancelled() && steps.tests.outcome != 'success'
        run: exit 1

  # Single status for branch protection: master requires a check named "Run tests".
  # It passes only if every matrix job passed.
  run-tests:
    name: Run tests
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          echo "matrix result: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = "success"
