name: Gem Validations

# Runs once per commit: on pull requests, and on master after a merge. Running on every
# branch push as well would bill the whole matrix twice for each push to an open PR.
on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch cancels the run still in progress for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Ruby ${{ matrix.ruby }} / rack ${{ matrix.rack }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is now 26.04, where setup-ruby has no builds for Ruby 2.5 to 3.1.
        os: [ubuntu-22.04]
        ruby: ['2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4']
        # rack 1.6.13 is the line the services run. angus-router, from every release on
        # rubygems, requires rack ~> 1.5, so there is no rack 2 line to test.
        rack: ['1']
        include:
          # JRuby: the versions the services run in production, all on rack 1.
          # setup-ruby ships x64 builds for ubuntu-24.04 only from JRuby 9.4.8.0 on; older
          # versions have to run on ubuntu-22.04.
          # 9.3.14.0 (external-commerce-service)
          - { os: ubuntu-22.04, ruby: 'jruby-9.3.14.0', rack: '1' }
          # 9.4.1.0
          - { os: ubuntu-22.04, ruby: 'jruby-9.4.1.0', rack: '1' }
          # 9.4.5.0
          - { os: ubuntu-22.04, ruby: 'jruby-9.4.5.0', rack: '1' }

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rack_${{ matrix.rack }}.gemfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

  # Single status for branch protection: master requires a check named "Run tests".
  # It passes only if every matrix job passed.
  run-tests:
    name: Run tests
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          echo "matrix result: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = "success"
