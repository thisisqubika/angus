name: Gem Validations

# Runs once per commit: on pull requests, and on master after a merge. Running on every
# branch push as well would bill the whole matrix twice for each push to an open PR.
on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch cancels the run still in progress for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: 'Run tests'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        ruby-version: ['2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4']
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: default
          rubygems: default
    
      - name: Install dependencies
        run: bundle install
    
      - name: Run tests
        run: bundle exec rspec
